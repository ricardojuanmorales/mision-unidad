name: Verificación

# Se ejecuta en cada push y en cada pull request: si algo se rompe,
# conviene enterarse antes de que un estudiante lo descubra.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos de TypeScript
        run: npm run typecheck

      - name: Ejecutar las pruebas
        run: npm test

      - name: Compilar la aplicación
        run: npm run build

      - name: Compilar la versión de un solo archivo
        run: npm run build:single

      # El HTML autocontenido queda disponible para descargar desde la
      # pestaña "Actions", útil para repartirlo sin conexión.
      - name: Publicar el HTML autocontenido como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mision-unidad-html
          path: dist-single/index.html
          if-no-files-found: error
